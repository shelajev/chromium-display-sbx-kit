<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The kit's own fontconfig configuration, selected with FONTCONFIG_FILE by
     sbx-chromium only. It reads the kit's fonts first and the base's (if it
     has any) after, and never replaces the base's /etc/fonts. -->
<fontconfig>
  <dir>@PREFIX@/share/fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <!-- Prebuilt, read-only at run time; new entries go to the user's cache. -->
  <cachedir>@PREFIX@/var/cache/fontconfig</cachedir>
  <cachedir prefix="xdg">sbx-chromium/fontconfig</cachedir>
  <include ignore_missing="yes">@PREFIX@/etc/fonts/conf.d</include>
</fontconfig>
