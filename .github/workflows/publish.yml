name: Publish Kit v3

# Publishing is release-only: push any v-prefixed version tag (v2.0.1,
# v2.1.0-rc1). The tag IS the version: it is passed to the descriptor as the
# kitVersion arg, so the image tag and the version inside the image always
# agree. Pre-release tags (with a '-') do not move :latest. Pull requests
# cannot start this workflow and never receive the Docker Hub credential.
#
# Each platform builds on its own native runner rather than under QEMU: the
# recipe smoke-tests Chromium before it ships, and Chromium does not run
# reliably under emulation (the arm64 half aborted in the GPU process). Each
# job pushes its image by digest; the merge job then writes one index naming
# both, so a tag never serves only one architecture.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/sbx-chromium-display

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version from tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          # The descriptor's arg pattern rejects this too, but only after the
          # runner has set up; fail in a second instead.
          echo "$version" | grep -Eq '^[0-9]+(\.[0-9A-Za-z-]+)*$' \
            || { echo "tag $RELEASE_TAG is not v<version>"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: chromium-display.yaml
          platforms: ${{ matrix.platform }}
          build-args: kitVersion=${{ env.VERSION }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Record digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Tags from version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          tags="-t $IMAGE:$version"
          case "$version" in
            *-*) ;;
            *) tags="$tags -t $IMAGE:latest" ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAGS=$tags" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The index this writes carries no kit annotations of its own; the
      # platform manifests do, and consumers fall back to them (SPEC-v3 §9.3).
      # kit-tck below reports that as a warning and still judges it conforming.
      - name: Create multi-arch tags
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2086
          docker buildx imagetools create $TAGS $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Validate the published kit
        run: |
          sh tools/install-kit-tck.sh
          "$(go env GOPATH)/bin/kit-tck" validate "$IMAGE:$VERSION"
