name: Validate Kit v3

# Every push to main builds the kit for the runner's platform — which runs the
# recipe's own smoke test (closure, render, shared browser, MCP + WebMCP round
# trip, agent registration) — and judges the artifact with kit-tck.
on:
  push:
    branches: [main, automation/weekly-maintenance]
  workflow_dispatch:
  workflow_call:
    inputs:
      maintenance:
        type: boolean
        default: false
      revision:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}

      - name: Download proposed pins
        if: inputs.maintenance == true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maintenance-pins
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Install kit-tck
        run: sh tools/install-kit-tck.sh

      # Releases take their version from the git tag; a main build is not a
      # release, so it says so.
      - name: Set CI version
        run: echo "VERSION=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build v3 mixin OCI artifact
        run: |
          docker buildx build . -f chromium-display.yaml \
            --build-arg kitVersion="${VERSION}" \
            -t "chromium-display:${VERSION}" \
            --output type=oci,dest=/tmp/chromium-display-layout,tar=false

      - name: Validate v3 conformance
        run: kit-tck validate --layout /tmp/chromium-display-layout "${VERSION}"

      # Every file must be root's or the agent's; a foreign uid in an overlay
      # is a real account on some base.
      - name: Audit overlay ownership
        run: |
          owners=$(for b in /tmp/chromium-display-layout/blobs/sha256/*; do
                     tar --numeric-owner -tvf "$b" 2>/dev/null; done \
                   | awk '{print ($2 ~ /\//) ? $2 : $3"/"$4}' | sort -u)
          echo "$owners"
          test -z "$(echo "$owners" | grep -Ev '^(0/0|1000/1000)$')"

      - name: Check script syntax
        run: |
          python3 tools/check-workflows.py
          node tools/maintain-pins-test.mjs
          node files/test/display-lifecycle-test.mjs
          bash -n run.sh
          for f in files/sbx-* files/display.sh files/test/*.sh tools/*.sh; do sh -n "$f"; done
          for f in files/*.mjs files/test/*.mjs tools/*.mjs; do node --check "$f"; done
